name: Public package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python3 tools/check_public.py --tracked
      - run: python3 -m unittest discover -s tests -v
      - run: node tests/test_frontend_steps.cjs
      - run: python3 tools/build_release.py --output "$RUNNER_TEMP/upward-workbench-source.zip"
